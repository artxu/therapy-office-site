<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="{{ page.summary | default: site.description | strip_newlines | escape }}" />
  <title>{{ page.title | escape }} — Art Xu, AMFT</title>
  <link rel="canonical" href="{{ page.url | absolute_url }}" />

  <!-- link previews -->
  <meta property="og:type" content="article" />
  <meta property="og:url" content="{{ page.url | absolute_url }}" />
  <meta property="og:site_name" content="Art Xu, AMFT" />
  <meta property="og:title" content="{{ page.title | escape }}" />
  <meta property="og:description" content="{{ page.summary | default: site.description | strip_newlines | escape }}" />
  <meta property="og:image" content="{{ '/assets/og-image.jpg' | absolute_url }}" />
  <meta property="article:published_time" content="{{ page.date | date_to_xmlschema }}" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="{{ page.title | escape }}" />
  <meta name="twitter:description" content="{{ page.summary | default: site.description | strip_newlines | escape }}" />
  <meta name="twitter:image" content="{{ '/assets/og-image.jpg' | absolute_url }}" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bitter:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Lato:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/styles.css' | relative_url }}" />
  <link rel="alternate" type="application/rss+xml" title="Writing — Art Xu, AMFT" href="{{ '/feed.xml' | absolute_url }}" />

  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "BlogPosting",
    "headline": {{ page.title | jsonify }},
    "description": {{ page.summary | default: site.description | strip_newlines | jsonify }},
    "datePublished": "{{ page.date | date_to_xmlschema }}",
    "dateModified": "{{ page.date | date_to_xmlschema }}",
    "mainEntityOfPage": { "@type": "WebPage", "@id": {{ page.url | absolute_url | jsonify }} },
    "url": {{ page.url | absolute_url | jsonify }},
    "inLanguage": "en-US",
    "author": {
      "@type": "Person",
      "name": "Art Xu",
      "jobTitle": "Registered Associate Marriage and Family Therapist",
      "url": {{ site.url | jsonify }}
    },
    "publisher": {
      "@type": "Person",
      "name": "Art Xu",
      "url": {{ site.url | jsonify }}
    }
  }
  </script>
</head>
<body class="reading">

  <header class="article-header">
    <a class="back-to-room" href="{{ '/' | relative_url }}">← Back to the office</a>
  </header>

  <main>
    <article class="article">
      <h1>{{ page.title | escape }}</h1>
      <p class="article-date">
        <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%B %-d, %Y" }}</time>
      </p>

      {{ content }}
    </article>

    <nav class="article-nav" aria-label="More writing">
      <a href="{{ '/writing/' | relative_url }}">← All writing</a>
      {% if page.previous %}<a href="{{ page.previous.url | relative_url }}">{{ page.previous.title | escape }} →</a>{% endif %}
    </nav>
  </main>

  <footer id="site-footer">
    <span>© {{ 'now' | date: "%Y" }} Art Xu · San Francisco, CA</span>
  </footer>

</body>
</html>
