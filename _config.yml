# Jekyll configuration — GitHub Pages builds this automatically on push.
title: Art Xu, AMFT
author: Art Xu
email: art@resonantsourcetherapy.co
description: >-
  Online therapy for complex trauma, attachment, and inner child work with
  Art Xu, AMFT. Telehealth sessions for clients across California.
url: "https://artxutherapy.com"
baseurl: ""
lang: en_US

# each post lives at /writing/<slug>/
permalink: /writing/:slug/

plugins:
  - jekyll-sitemap   # regenerates sitemap.xml on every build, including new posts
  - jekyll-feed      # RSS at /feed.xml

feed:
  path: feed.xml

# files that are not part of the built site
exclude:
  - Gemfile
  - Gemfile.lock
  - vendor
  - README.md
  - .DS_Store
